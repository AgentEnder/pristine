# The published package is `pristine-cli`: the plain `pristine` on crates.io is a 0.0.0
# placeholder from an unrelated project and crates.io does not reclaim names. The binary a
# human types stays `pristine` on every channel, so the collision leaks into exactly one
# install string (`cargo install pristine-cli`).
[package]
name = "pristine-cli"
description = "A language-agnostic reclaimable-space finder and cleaner."
# Deliberately a literal, not `version.workspace = true`: `nx release` owns this line, and
# @monodon/rust's version actions require `[package].version` to be a plain string. Inheriting
# it from the workspace makes the crate silently skip versioning while the npm packages bump.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["disk", "cleanup", "node_modules", "cli"]
categories = ["command-line-utilities", "filesystem"]
# Nx wiring is workspace machinery; it has no business inside the published crate.
exclude = ["project.json"]

# The library is `pristine` even though the package is `pristine-cli`, so `use pristine::…`
# reads the same in the integration tests as it will in any downstream consumer.
[lib]
name = "pristine"
path = "src/lib.rs"

[[bin]]
name = "pristine"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# ripgrep's walker. It brings the parallel walk and the full gitignore stack in one
# dependency; tier one uses the first half and tier two (#588) gets the second half free.
ignore = "0.4.33"
# Already in the tree via `ignore`, so the marker/target globs (`*.csproj`, `bazel-*`) cost
# no new compilation.
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
# The deleter's descriptor-relative syscalls: `openat` with `O_NOFOLLOW`, `fstatat`,
# `unlinkat`. This is the layer `cap-std` is built from, taken directly because the deleter
# wants the primitives rather than the capability wrapper. It is what lets the removal descend
# without resolving a path — the property the safety model rests on — while keeping the
# crate's `unsafe_code = "forbid"`, which a hand-rolled `libc` descent could not.
cap-primitives = "4.0.2"

[dev-dependencies]
tempfile = "3.27.0"
# Setting a directory's mtime is the only way to test the age floor against a real
# filesystem rather than against an injected clock, and the standard library can only do it
# for an open `File`. Tests only: nothing shipped writes a timestamp.
filetime = "0.2.28"

[lints]
workspace = true
