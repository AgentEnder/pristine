
[package]
name = 'pristine-cli'
description = 'A language-agnostic reclaimable-space finder and cleaner.'
version = '0.1.0'
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = '../../README.md'
keywords = ['disk', 'cleanup', 'node_modules', 'cli']
categories = ['command-line-utilities', 'filesystem']
exclude = ['project.json']

[lib]
name = 'pristine'
path = 'src/lib.rs'

[[bin]]
name = 'pristine'
path = 'src/main.rs'

[dependencies]
clap = { version = '4.6', features = ['derive'] }
ignore = '0.4.33'
globset = '0.4.20'
ratatui = { version = '0.30', default-features = false, features = [
	'crossterm',
	'layout-cache',
] }
regex = '1.12'
serde = { version = '1.0.229', features = ['derive'] }
toml = '1.1.4'
unicode-normalization = '0.1.25'
cap-primitives = '4.0.2'

[dev-dependencies]
tempfile = '3.27.0'
filetime = '0.2.28'

[lints]
workspace = true
