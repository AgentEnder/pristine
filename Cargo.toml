[workspace]
resolver = "3"
members = ["packages/pristine"]

[workspace.package]
# No `version` here on purpose. Each crate carries its own literal version because that is the
# line `nx release` rewrites; a workspace-level copy would be a second source of truth that
# drifts out of lockstep with the npm packages.
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AgentEnder/pristine"
authors = ["Craigory Coppola <craigorycoppola@gmail.com>"]

# The lint bar lives here rather than in each crate so members inherit it with
# `[lints] workspace = true`. CI runs clippy with `-D warnings`, so every level below
# is effectively deny in CI and warn while you work.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A tool whose whole job is deleting directories does not get to panic on a `None`. Tests
# are exempt via `allow-{unwrap,expect}-in-tests` in clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
