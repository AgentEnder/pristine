name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag. A tag is a mutable
      # pointer the action's owner can move, so `@v4` is a standing grant to run whatever
      # they publish next on a runner holding our tokens. The trailing comment is the only
      # human-readable part; when bumping, resolve the new tag with
      # `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha` (that dereferences an
      # ANNOTATED tag to its commit — `git ls-remote refs/tags/<tag>` alone can hand you the
      # tag object's own sha, which `uses:` will not resolve).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml is the toolchain source of truth, so CI installs from it rather than
      # naming versions a second time here.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features

  nx:
    name: nx
    runs-on: ubuntu-latest
    steps:
      # Same SHAs as the rust job above; see the note there before changing either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: pnpm install --frozen-lockfile

      # The rust job above is the authority on whether the code is green. This one exists
      # so the Nx targets cannot quietly rot into commands that no longer run.
      - run: pnpm nx run-many -t fmt-check lint test
